<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR do São João de Gravatá – Turismo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>TR do São João de Gravatá – Turismo</h1>
        <form id="turismoForm">
            <div class="form-group">
                <label for="nome">Nome do Responsável *</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="cargo">Cargo ou Função *</label>
                <input type="text" id="cargo" name="cargo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail para Contato *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone *</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>

            <div class="form-group">
                <label for="banda">Nome da Banda / Atração *</label>
                <input type="text" id="banda" name="banda" required>
            </div>

            <div class="form-group">
                <label for="genero">Gênero Musical *</label>
                <input type="text" id="genero" name="genero" required>
            </div>

            <div class="form-group">
                <label for="integrantes">Quantidade de Integrantes *</label>
                <input type="number" id="integrantes" name="integrantes" required min="1">
            </div>

            <div class="form-group">
                <label for="origem">Origem (Cidade/Estado) *</label>
                <input type="text" id="origem" name="origem" required>
            </div>

            <div class="form-group">
                <label for="data">Data da Apresentação *</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="form-group">
                <label for="horario">Horário de Início e Término *</label>
                <input type="text" id="horario" name="horario" placeholder="Ex: 20h às 22h" required>
            </div>

            <div class="form-group">
                <label for="duracao">Duração do Show (em minutos) *</label>
                <input type="number" id="duracao" name="duracao" required min="1">
            </div>

            <div class="form-group">
                <label for="local">Local Sugerido *</label>
                <select id="local" name="local" required>
                    <option value="">Selecione um local</option>
                    <option value="Pátio de Eventos">Pátio de Eventos</option>
                    <option value="Polo da Sanfona">Polo da Sanfona</option>
                    <option value="Outro">Outro</option>
                </select>
                <input type="text" id="outroLocal" name="outroLocal" placeholder="Especifique outro local" style="display:none;">
            </div>

            <div class="form-group">
                <label for="cache">Valor do Cachê (R$) *</label>
                <input type="number" id="cache" name="cache" step="0.01" required min="0">
            </div>

            <div class="form-group">
                <label for="pagamento">Forma de Pagamento *</label>
                <input type="text" id="pagamento" name="pagamento" required>
            </div>

            <div class="form-group">
                <label>Há despesas extras? (alimentação, hospedagem, transporte) *</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="despesas" value="sim" required> Sim
                    </label>
                    <label>
                        <input type="radio" name="despesas" value="nao"> Não
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="equipamentos">Equipamentos Necessários (som, iluminação etc.)</label>
                <textarea id="equipamentos" name="equipamentos" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="exigencias">Exigências Técnicas (rider técnico)</label>
                <textarea id="exigencias" name="exigencias" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="links">Link do Portfólio / Vídeos / Instagram</label>
                <input type="url" id="links" name="links">
            </div>

            <div class="form-group">
                <label>Documentação Anexa (será enviada por e-mail) *</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="documentacao" value="sim" required> Sim
                    </label>
                    <label>
                        <input type="radio" name="documentacao" value="nao"> Não
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações Finais</label>
                <textarea id="observacoes" name="observacoes" rows="3"></textarea>
            </div>

            <div class="form-group submit-group">
                <button type="submit">Enviar Formulário</button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
